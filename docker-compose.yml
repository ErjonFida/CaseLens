services:
  caselens:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: caselens-dev:latest
    container_name: caselens-api
    ports:
      - "8000:8000"
    volumes:
      - legal_db:/app/db
      - legal_uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY
      - JWT_SECRET
      - GEMINI_MODEL
      - ALLOWED_ORIGINS
      - ENVIRONMENT
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - TESSERACT_CMD
      - POPPLER_PATH
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_SENDER
      - DATABASE_URL=postgresql://legal_user:legal_password@db:5432/legal_db
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: pgvector/pgvector:pg16
    container_name: caselens-db
    environment:
      POSTGRES_USER: legal_user
      POSTGRES_PASSWORD: legal_password
      POSTGRES_DB: legal_db
    ports:
      - "5432:5432"
    volumes:
      # Postgres needs a volume of its own. Sharing `legal_db` with the app put
      # the app's files in Postgres's data directory, so initdb was skipped -
      # and POSTGRES_PASSWORD only ever applies during initdb, which is why
      # authentication failed.
      - legal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_user -d legal_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  legal_db:
  legal_pgdata:
  legal_uploads:
